  # ── Compliance Endpoints (Port 8083) ──
  /v1/llm/completion:
    post:
      summary: Apply strict data-residency geo checks on completions
      tags:
        - Compliance
      security:
        - BearerAuth: []
      parameters:
        - name: x-user-region
          in: header
          required: false
          description: User's reported home region.
          schema:
            type: string
            example: "IN"
        - name: x-enforce-region
          in: header
          required: false
          description: Force a strict residency region check.
          schema:
            type: string
        - name: x-forwarded-for
          in: header
          required: false
          description: Downstream IP address. Used for Geo-IP resolver.
          schema:
            type: string
            example: "103.21.244.1"
        - name: x-model-requested
          in: header
          required: false
          description: Model identifier for region lock validations.
          schema:
            type: string
            example: "o1-preview"
      responses:
        "200":
          description: Allowed. Returns residency decision routing parameters.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - region
                  - endpoint
                  - isolation
                properties:
                  status:
                    type: string
                    example: "routed"
                  region:
                    type: string
                    example: "IN"
                  endpoint:
                    type: string
                    example: "https://api.in.kryneth.ai/v1"
                  isolation:
                    type: boolean
                    example: true
        "403":
          description: Region lock violation (e.g. o1-preview from India).

  /v1/compliance/redact:
    post:
      summary: Scan prompt and replace identified PII text with masks
      tags:
        - Compliance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - payload
              properties:
                payload:
                  $ref: '#/components/schemas/ComplianceRedactPayload'
      responses:
        "200":
          description: Sanity audit complete.
          content:
            application/json:
              schema:
                type: object
                required:
                  - sanitized_payload
                  - redacted_count
                properties:
                  sanitized_payload:
                    type: string
                    example: "My email is [EMAIL_1] and my card is [CREDIT_CARD_1]"
                  mapping_stored:
                    type: boolean
                    example: true
                  redacted_count:
                    type: integer
                    example: 2
                  token_map:
                    type: object
                    example:
                      "[EMAIL_1]": "test@kryneth.dev"
                      "[CREDIT_CARD_1]": "1234-5678-9012-3456"


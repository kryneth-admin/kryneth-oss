name: Kryneth AI Gateway CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  unit_tests:
    name: Rust Check & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install Protoc (Required for Tonic Build)
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cargo Check
      run: cargo check

    - name: Cargo Test (132 Unit Tests)
      run: cargo test

    - name: Cargo Clippy
      run: cargo clippy -- -D warnings

  e2e_and_trace_suite:
    name: E2E 50+ Scenarios & White-Box Trace Suite
    runs-on: ubuntu-latest
    needs: unit_tests

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Mock Server Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn anyio pydantic requests

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Start Python Upstream Mock Server (Port 9090)
      run: |
        python mock_server/main.py &
        sleep 2

    - name: Build and Start Kryneth AI Gateway (Port 8080)
      run: |
        cargo run --bin kryneth_gateway &
        sleep 5

    - name: Run 50+ Scenario Integration Suite
      run: |
        cd e2e_clients
        npm install
        node runner.js

    - name: Run White-Box Trace Audit Suite
      run: |
        cd e2e_runner
        npm install
        npm test

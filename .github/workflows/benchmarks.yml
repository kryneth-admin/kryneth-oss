name: Load Testing Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  benchmark:
    name: Run k6 Load Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start Mock Upstream Server
        run: |
          cargo run --example mock_upstream --release > mock_upstream.log 2>&1 & echo $! > mock_upstream.pid

      - name: Start Kryneth Gateway
        run: |
          ulimit -n 65536 || true
          export RUST_LOG=debug
          export RUST_BACKTRACE=1
          COMPLIANCE_URL=http://localhost:8090 ROUTING_CONFIG_PATH=routing.bench.yaml \
            cargo run --release > gateway.log 2>&1 & echo $! > gateway.pid

      - name: Wait for services to be ready
        run: |
          echo "Waiting for mock upstream (port 8090)..."
          while ! nc -z localhost 8090; do sleep 1; done
          
          echo "Waiting for Kryneth Gateway (port 8080 HTTP health)..."
          for i in $(seq 1 120); do
            if curl -sSf http://localhost:8080/health >/dev/null 2>&1; then
              echo "Gateway healthy"
              break
            fi
            echo "Gateway not healthy yet: attempt $i/120..."
            sleep 1
          done
          
          if ! curl -sSf http://localhost:8080/health >/dev/null 2>&1; then
            echo "Gateway failed to start within 120s! Dumping gateway.log"
            tail -n 200 gateway.log || true
            exit 1
          fi
          
          echo "Services are ready! Adding mandatory 10s sleep..."
          sleep 10

      - name: Run Cache Hit Benchmark
        run: |
          echo "## Cache Hit Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          k6 run tests/load/cache_hit_benchmark.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run PII Scrubbing Benchmark
        run: |
          echo "## PII Scrubbing Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          k6 run tests/load/pii_scrubbing_benchmark.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Loop Detection Benchmark
        run: |
          echo "## Loop Detection Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          k6 run tests/load/loop_detection_benchmark.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Mixed Workload Benchmark
        run: |
          echo "## Mixed Workload Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          k6 run tests/load/mixed_workload_benchmark.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run Dynamic Payload Benchmark
        run: |
          echo "## Dynamic Payload Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          k6 run tests/load/dynamic_payload_benchmark.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run MCP Fanout Benchmark
        run: |
          echo "## MCP Fanout Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          k6 run tests/load/mcp_fanout_benchmark.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Print Summary Table
        run: |
          echo "## Benchmark Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache Hit | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| PII Scrubbing | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Loop Detection | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Mixed Workload | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Dynamic Payload | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| MCP Fanout | ✅ Completed |" >> $GITHUB_STEP_SUMMARY

      - name: Dump logs on failure or completion
        if: always()
        run: |
          echo "=== Gateway (last 500 lines) ==="
          [ -f gateway.log ] && tail -n 500 gateway.log || echo "gateway.log missing"
          echo "=== Mock upstream (last 500 lines) ==="
          [ -f mock_upstream.log ] && tail -n 500 mock_upstream.log || echo "mock_upstream.log missing"
          echo "=== Gateway process info ==="
          if [ -f gateway.pid ]; then
            pid=$(cat gateway.pid)
            ps -p $pid -o pid,cmd,etime || true
            lsof -Pan -p $pid -i || true
          fi

name: Render VHS Tapes

on:
  push:
    paths:
      - '**/*.tape'
  workflow_dispatch:

jobs:
  vhs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Render VHS tapes via Docker
        run: |
          # The official VHS docker image has ffmpeg, ttyd, and chromium perfectly pre-installed.
          docker run --rm -v ${{ github.workspace }}:/vhs ghcr.io/charmbracelet/vhs docs/agent_loop_blocked.tape
          docker run --rm -v ${{ github.workspace }}:/vhs ghcr.io/charmbracelet/vhs docs/llm_hotswap.tape

      - name: Commit generated GIFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate VHS terminal GIFs"
          file_pattern: 'docs/*.gif'
